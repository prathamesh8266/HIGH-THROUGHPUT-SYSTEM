worker_processes 2;
events {
    worker_connections 4096;
}
http {
    resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;
    upstream yelp_backends {
        zone yelp_backends 64k;
        server yelp-api-backends.yelp-scale.svc.cluster.local:8080 resolve;
        keepalive 128;
    }
    server {
        listen 8080;
        location / {
            proxy_pass http://yelp_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
