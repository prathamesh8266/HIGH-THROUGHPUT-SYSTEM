apiVersion: v1
kind: Service
metadata:
  name: yelp-api-backends
spec:
  clusterIP: None
  selector:
    app: yelp-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yelp-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: yelp-api
  template:
    metadata:
      labels:
        app: yelp-api
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: yelp-api
      containers:
        - name: api
          image: yelp-fastapi:kind
          imagePullPolicy: Never
          env:
            - name: WEB_CONCURRENCY
              value: "1"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: app
            - name: DB_USER
              value: app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: password
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
